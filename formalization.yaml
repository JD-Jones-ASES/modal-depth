  notes: >-
    Internal agent review and mechanical verification address theorem
    scope, proof contracts, allowed axioms, and targeted negative controls.
    No independent human specialist peer review or worldwide priority
    determination is claimed. Exact-commit evidence is described in
    Verification.md; verification is distinct from Palomar registration.
status:
  scope: >-
    The proved structural equivalences preserve ordinary interpolation
    properties on their right-hand sides. Positive interpolation existence
    after removing those properties is conditional on the published
    ordinary interpolation inputs. Substitution and composition
    classifications do not require interpolation hypotheses.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
