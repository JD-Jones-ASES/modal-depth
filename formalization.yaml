fidelity:
  divergences: >-
    For positive n, interpolation classifications are stated over natural-number
    atoms and arbitrary label types. Depth-substitution classification requires
    a nonempty source atom type and permits an arbitrary target atom type,
    including an empty one. Composition classification requires nonempty
    source and intermediate atom types and an arbitrary final atom type.
    Periodicity constrains positive depths only, leaving the root label free.
    The transfer theorem takes a supplied ordinary interpolant; it does not
    implement an interpolation algorithm. Its node-count and modal-depth
    equalities are not bounds on proof size, name bit encoding, or runtime.
